name: Build and validate Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SmartLanguageSwitcher -c Release -warnaserror
      - name: Publish self-contained single-file EXE
        run: dotnet publish SmartLanguageSwitcher -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish
      - name: Validate packaged executable on Windows
        shell: pwsh
        run: ./scripts/Validate.ps1
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/SmartLanguageSwitcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SmartLanguageSwitcher.exe" | Set-Content publish/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SmartLanguageSwitcher-win-x64
          path: publish/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartLanguageSwitcher-win-x64
          path: publish
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" publish/SmartLanguageSwitcher.exe publish/SHA256SUMS.txt publish/validation.json --verify-tag --title "Smart Language Switcher $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
